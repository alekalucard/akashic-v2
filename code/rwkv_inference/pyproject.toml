[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rwkv_inference"
version = "0.1.0"
description = "RWKV-7 inference kernel — Rust forward pass for Akashic"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module", "cuda"]
python-source = "python"
module-name = "rwkv_inference._native"
