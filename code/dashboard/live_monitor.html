<!DOCTYPE html>
<html>
<head>
    <title>Akashic Live Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { color: #00d4ff; margin-bottom: 10px; }
        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        .status-item {
            display: flex;
            flex-direction: column;
        }
        .status-label { font-size: 12px; color: #888; }
        .status-value { font-size: 24px; font-weight: bold; }
        .status-value.good { color: #00ff88; }
        .status-value.bad { color: #ff4444; }
        .status-value.warn { color: #ffaa00; }

        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .panel h2 {
            color: #00d4ff;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .panel.full-width { grid-column: 1 / -1; }

        .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 4px 8px;
            margin: 2px 0;
            border-radius: 4px;
            background: #0f0f23;
        }
        .log-entry.error { background: #3d1515; border-left: 3px solid #ff4444; }
        .log-entry.warning { background: #3d3015; border-left: 3px solid #ffaa00; }
        .log-entry.success { background: #153d15; border-left: 3px solid #00ff88; }
        .log-entry.info { border-left: 3px solid #00d4ff; }

        .fairy-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .fairy-tag {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            background: #0f3460;
        }
        .fairy-tag.running { background: #0f4030; color: #00ff88; }
        .fairy-tag.error { background: #400f0f; color: #ff4444; }

        .refresh-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: #16213e;
            border-radius: 4px;
            font-size: 12px;
        }
        .refresh-indicator.active { color: #00ff88; }

        .big-message {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #888;
        }
        .timestamp { color: #666; font-size: 10px; }
    </style>
</head>
<body>
    <h1>Akashic Live Monitor</h1>
    <p style="color: #666; margin-bottom: 20px;">Auto-refreshes every 2 seconds. Open this file in your browser.</p>

    <div class="refresh-indicator" id="refresh">Connecting...</div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">SERVER</span>
            <span class="status-value" id="server-status">--</span>
        </div>
        <div class="status-item">
            <span class="status-label">UPTIME</span>
            <span class="status-value" id="uptime">--</span>
        </div>
        <div class="status-item">
            <span class="status-label">FAIRIES</span>
            <span class="status-value" id="fairy-count">--</span>
        </div>
        <div class="status-item">
            <span class="status-label">ERRORS</span>
            <span class="status-value" id="error-count">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">LAST UPDATE</span>
            <span class="status-value" id="last-update" style="font-size: 14px;">--</span>
        </div>
    </div>

    <div class="panels">
        <div class="panel" id="fairy-panel">
            <h2>Fairies</h2>
            <div class="fairy-list" id="fairy-list"></div>
        </div>

        <div class="panel" id="error-panel">
            <h2>Errors and Warnings</h2>
            <div id="error-list"></div>
        </div>

        <div class="panel full-width" id="activity-panel">
            <h2>Activity Log</h2>
            <div id="activity-log"></div>
        </div>
    </div>

    <script>
        const SERVER = 'http://127.0.0.1:5757';
        let errorCount = 0;
        let activityLog = [];
        let lastStatus = null;

        function formatTime(date) {
            return date.toLocaleTimeString();
        }

        function formatUptime(seconds) {
            if (seconds < 60) return Math.floor(seconds) + 's';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
            return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
        }

        function addActivity(message, type) {
            type = type || 'info';
            activityLog.unshift({ time: new Date(), message: message, type: type });
            if (activityLog.length > 100) activityLog.pop();
            renderActivity();
        }

        function renderActivity() {
            const container = document.getElementById('activity-log');
            container.textContent = '';
            if (activityLog.length === 0) {
                container.textContent = 'Waiting for activity...';
                return;
            }
            activityLog.forEach(function(entry) {
                const div = document.createElement('div');
                div.className = 'log-entry ' + entry.type;
                const ts = document.createElement('span');
                ts.className = 'timestamp';
                ts.textContent = formatTime(entry.time) + ' ';
                div.appendChild(ts);
                div.appendChild(document.createTextNode(entry.message));
                container.appendChild(div);
            });
        }

        function addError(message) {
            errorCount++;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('error-count').className = 'status-value bad';

            const container = document.getElementById('error-list');
            const entry = document.createElement('div');
            entry.className = 'log-entry error';
            const ts = document.createElement('span');
            ts.className = 'timestamp';
            ts.textContent = formatTime(new Date()) + ' ';
            entry.appendChild(ts);
            entry.appendChild(document.createTextNode(message));
            container.insertBefore(entry, container.firstChild);

            addActivity(message, 'error');
        }

        async function fetchStatus() {
            const refreshEl = document.getElementById('refresh');
            refreshEl.textContent = 'Updating...';
            refreshEl.className = 'refresh-indicator active';

            try {
                const healthRes = await fetch(SERVER + '/health');
                const health = await healthRes.json();

                document.getElementById('server-status').textContent = health.healthy ? 'ONLINE' : 'ERROR';
                document.getElementById('server-status').className = 'status-value ' + (health.healthy ? 'good' : 'bad');
                document.getElementById('uptime').textContent = formatUptime(health.uptime);
                document.getElementById('uptime').className = 'status-value good';

                const statusRes = await fetch(SERVER + '/status');
                const status = await statusRes.json();

                const statusStr = JSON.stringify(status);
                if (statusStr !== lastStatus) {
                    lastStatus = statusStr;

                    if (status.error) {
                        addError('Status error: ' + status.error);
                    }

                    let fairyCount = 0;
                    let fairyList = [];

                    if (status.fairies) {
                        if (Array.isArray(status.fairies)) {
                            fairyCount = status.fairies.length;
                            fairyList = status.fairies;
                        } else if (typeof status.fairies === 'object') {
                            fairyCount = status.fairies.total || status.fairies.running || 0;
                            if (status.fairies.list) fairyList = status.fairies.list;
                        }
                    }

                    document.getElementById('fairy-count').textContent = fairyCount;
                    document.getElementById('fairy-count').className = 'status-value ' + (fairyCount > 0 ? 'good' : 'warn');

                    const fairyContainer = document.getElementById('fairy-list');
                    fairyContainer.textContent = '';
                    if (fairyList.length > 0) {
                        fairyList.forEach(function(f) {
                            const name = typeof f === 'string' ? f : (f.name || f.ACTOR_NAME || 'Unknown');
                            const state = typeof f === 'object' ? (f.state || 'running') : 'running';
                            const tag = document.createElement('span');
                            tag.className = 'fairy-tag ' + (state === 'running' ? 'running' : 'error');
                            tag.textContent = name;
                            fairyContainer.appendChild(tag);
                        });
                    } else if (fairyCount > 0) {
                        fairyContainer.textContent = fairyCount + ' fairies running';
                    } else {
                        fairyContainer.textContent = 'No fairies detected';
                    }

                    addActivity('Status: ' + fairyCount + ' fairies, healthy=' + health.healthy, 'info');
                }

                document.getElementById('last-update').textContent = formatTime(new Date());
                refreshEl.textContent = 'Connected';

            } catch (err) {
                document.getElementById('server-status').textContent = 'OFFLINE';
                document.getElementById('server-status').className = 'status-value bad';
                refreshEl.textContent = 'Disconnected';
                refreshEl.className = 'refresh-indicator';
                addError('Cannot connect: ' + err.message);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 2000);
        addActivity('Monitor started', 'success');
    </script>
</body>
</html>
